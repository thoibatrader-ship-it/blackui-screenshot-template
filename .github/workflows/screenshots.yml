name: Capture Screenshots

# One repo serves many apps: each app lives in jobs/<job>/ (app.html + request.json).
# The dashboard passes `job` (letters, digits, - and _ only). Empty = the legacy screenshot-tool/input folder.
run-name: Capture Screenshots - ${{ inputs.job || 'default' }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'App folder name under jobs/ (leave empty for screenshot-tool/input)'
        required: false
        default: ''
        type: string

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # NOTE: no permit check yet (free and open for now).
      # Later: add a "Verify media permit" step HERE, as the very first step, same pattern as build-apk.yml.

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tool dependencies
        working-directory: screenshot-tool
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: screenshot-tool
        run: npx playwright install --with-deps chromium

      - name: Scan and capture
        working-directory: screenshot-tool
        env:
          JOB: ${{ inputs.job }}
        run: node capture.mjs

      # Small artifact first: manifest.json + thumbnails (the AI looks at these).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-preview-${{ inputs.job || 'default' }}
          retention-days: 7
          path: screenshot-tool/out/preview
          if-no-files-found: warn

      # Full-resolution PNGs (the dashboard picks the chosen ones out of this).
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: shots-full-${{ inputs.job || 'default' }}
          retention-days: 3
          path: screenshot-tool/out/full
          if-no-files-found: warn
