name: Capture Screenshots

# One repo serves many apps: each app lives in jobs/<job>/ (app.html + request.json).
# The dashboard passes `job` (letters, digits, - and _ only). Empty = the legacy screenshot-tool/input folder.
run-name: Capture Screenshots - ${{ inputs.job || 'default' }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'App folder name under jobs/ (leave empty for screenshot-tool/input)'
        required: false
        default: ''
        type: string

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Ticket check. Keep this the FIRST step: no valid permit = nothing below runs.
      # The BlackUI dashboard puts a signed permit into this repo's secret SHOT_PERMIT right before it starts the run.
      # The server takes the ticket(s) the first time it sees a permit; running the same permit again is free.
      - name: Verify capture permit
        env:
          SHOT_PERMIT: ${{ secrets.SHOT_PERMIT }}
          VERIFY_URL: https://blackui.thoibatrader.com/api/shot/verify
        run: |
          if [ -z "$SHOT_PERMIT" ]; then
            echo "::error::No capture permit found. Start the capture from the BlackUI dashboard (reload the app if you already did)."
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o verify.json -w '%{http_code}' -X POST "$VERIFY_URL" \
              -H 'Content-Type: application/json' --data "{\"permit\":\"$SHOT_PERMIT\"}" || echo 000)
            if [ "$code" = "200" ]; then echo "Permit accepted."; exit 0; fi
            if [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "402" ]; then
              msg=$(python3 -c 'import json;print(json.load(open("verify.json"))["error"]["message"])' 2>/dev/null || true)
              echo "::error::Capture not allowed: ${msg:-permit refused (HTTP $code)}"
              exit 1
            fi
            echo "Server answered HTTP $code (attempt $attempt of 5), trying again..."
            sleep $((attempt * 4))
          done
          echo "::error::Could not reach the permit server. Please try the capture again in a few minutes."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tool dependencies
        working-directory: screenshot-tool
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: screenshot-tool
        run: npx playwright install --with-deps chromium

      - name: Scan and capture
        working-directory: screenshot-tool
        env:
          JOB: ${{ inputs.job }}
        run: node capture.mjs

      # Small artifact first: manifest.json + thumbnails (the AI looks at these).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-preview-${{ inputs.job || 'default' }}
          retention-days: 14
          path: screenshot-tool/out/preview
          if-no-files-found: warn

      # Full-resolution PNGs (the dashboard picks the chosen ones out of this).
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: shots-full-${{ inputs.job || 'default' }}
          retention-days: 14
          path: screenshot-tool/out/full
          if-no-files-found: warn
